<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>冲突回顾</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #fff; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#lock { position: fixed; inset: 0; background: #f7f8fa; z-index: 999; display: flex; align-items: center; justify-content: center; }
.lockbox { text-align: center; padding: 24px; }
.lockico { font-size: 44px; margin-bottom: 14px; }
.lockbox input { font-size: 17px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 10px; width: 230px; text-align: center; letter-spacing: 2px; outline: none; }
.lockbox input:focus { border-color: #1a7f37; }
.lockbox button { margin-top: 14px; padding: 9px 30px; border: none; border-radius: 10px; background: #1a7f37; color: #fff; font-size: 15px; cursor: pointer; }
.lockbox button:hover { background: #14682c; }
#pwderr { color: #d1242f; font-size: 13px; margin-top: 12px; min-height: 18px; }
.locktip { font-size: 12px; color: #999; margin-top: 8px; }
#app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.mhead { display: none; }
.side { width: 230px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 20px 8px 20px 24px; }
.side h1 { font-size: 18px; font-weight: 700; line-height: 1.4; }
.side .sub { font-size: 12px; color: #999; line-height: 1.7; }
.evbox { background: #f7f7f7; border: 1px solid #eee; border-radius: 12px; padding: 14px 14px 10px; }
.evbox .row2 { font-size: 13px; color: #555; margin: 6px 0; }
.stage { flex: 1; display: flex; align-items: stretch; justify-content: center; gap: 28px; min-height: 0; overflow: hidden; padding: 0 16px; }
.nav { width: 50px; height: 50px; border-radius: 50%; background: #f5f5f5; border: 1px solid #e0e0e0; color: #555; font-size: 24px; cursor: pointer; flex: none; transition: .15s; align-self: center; }
.nav:hover { background: #e8e8e8; color: #111; }
.nav:disabled { opacity: .25; cursor: default; }
.phone { width: min(88vw, 360px); align-self: stretch; height: auto; background: #000; border-radius: 36px; padding: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.25); flex: none; }
.screen { width: 100%; height: 100%; border-radius: 27px; background: #ededed; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 110px; height: 22px; background: #000; border-radius: 12px; z-index: 5; }
.status { height: 34px; background: #ededed; color: #000; font-size: 12px; display: flex; justify-content: space-between; align-items: flex-end; padding: 4px 18px 2px; }
.chathead { height: 44px; background: #ededed; display: flex; align-items: center; padding: 0 10px; border-bottom: .5px solid #d8d8d8; position: relative; }
.chathead .back { font-size: 18px; color: #000; width: 30px; }
.avatar { width: 32px; height: 32px; border-radius: 6px; background: linear-gradient(135deg,#6ec6ff,#3b82f6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; margin: 0 8px; }
.chathead .name { font-size: 15px; color: #000; flex: 1; }
.chathead .icons { color: #000; font-size: 15px; letter-spacing: 8px; }
.msgs { flex: 1; overflow-y: auto; padding: 10px 12px; background: #ededed; scroll-behavior: smooth; }
.msgs::-webkit-scrollbar { width: 4px; }
.msgs::-webkit-scrollbar-thumb { background: #bbb; border-radius: 2px; }
.daysep { text-align: center; font-size: 11px; color: #b0b0b0; margin: 10px 0 6px; }
.row { display: flex; margin: 5px 0; align-items: flex-end; }
.row.me { flex-direction: row-reverse; }
.ava2 { width: 34px; height: 34px; border-radius: 6px; background: linear-gradient(135deg,#f6c453,#f0a020); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
.ava2.me { background: linear-gradient(135deg,#6ec6ff,#3b82f6); }
.bub { max-width: 68%; padding: 8px 11px; font-size: 14px; line-height: 1.45; border-radius: 8px; position: relative; word-break: break-word; white-space: pre-wrap; }
.row.them .bub { background: #fff; color: #000; margin-left: 8px; border-top-left-radius: 2px; }
.row.me .bub { background: #95ec69; color: #000; margin-right: 8px; border-top-right-radius: 2px; }
.row.sys { justify-content: center; }
.row.sys .bub { background: transparent; color: #999; font-size: 12px; max-width: 90%; text-align: center; }
.kws { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.kw { font-size: 10px; color: #b91c1c; background: #fde8e8; border: 1px solid #f5c2c2; border-radius: 6px; padding: 0 5px; }
.sigline { width: 2px; position: absolute; left: -6px; top: 2px; bottom: 2px; border-radius: 1px; background: #d1242f; }
.inputbar { height: 46px; background: #f7f7f7; border-top: .5px solid #d8d8d8; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
.inputbar .mic { flex: 1; background: #fff; border-radius: 6px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #333; }
.inputbar .plus { font-size: 18px; color: #333; }
.vtl { width: 258px; flex: none; overflow-y: auto; padding: 6px 14px 6px 10px; align-self: center; max-height: 100%; }
.vtl::-webkit-scrollbar { width: 4px; }
.vtl::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
.vrow { position: relative; padding: 4px 0 4px 26px; cursor: pointer; border-radius: 8px; transition: .12s; }
.vrow:hover { background: #f7f7f7; }
.vrow::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: #e6e6e6; }
.vrow:first-child::before { top: 12px; }
.vrow:last-child::before { bottom: 55%; }
.vdot { position: absolute; left: 3px; top: 9px; width: 12px; height: 12px; border-radius: 50%; z-index: 1; transition: .12s; }
.vrow.active .vdot { transform: scale(1.35); box-shadow: 0 0 0 3px rgba(0,0,0,.07); }
.vmeta .vdate { font-size: 11px; color: #999; }
.vmeta .vlabel { font-size: 12px; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
.vrow.active .vlabel { color: #111; font-weight: 600; }
@media (max-width: 1000px) { .stage { gap: 8px; } .nav { width: 38px; height: 38px; font-size: 18px; } .side { display: none; } .vtl { width: 210px; } }
@media (max-width: 760px) {
  body { overflow-y: auto; height: auto; }
  .mhead { display: block; text-align: center; padding: 10px 12px 6px; }
  .mhead .mh1 { font-size: 16px; font-weight: 700; }
  .mhead .mh2 { font-size: 12px; color: #555; margin-top: 4px; }
  .mhead .mh3 { font-size: 11px; color: #999; margin-top: 2px; }
  .stage { flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; height: auto; overflow: visible; padding: 4px 10px 12px; }
  .phone { width: min(94vw, 430px); height: min(58vh, 540px); align-self: center; }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; font-size: 20px; opacity: .92; z-index: 20; }
  #prev { left: 4px; } #next { right: 4px; }
  .vtl { width: 100%; max-height: 34vh; align-self: center; padding: 4px 14px; }
  .vrow { padding: 6px 0 6px 28px; }
}
</style></head><body>

<script>
let idx = 0;
let EV = null;

function b64d(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function unlock() {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('pwderr');
  err.textContent = '';
  if (!pwd) { err.textContent = '请输入密钥'; return; }
  try {
    const enc = new TextEncoder();
    const salt = b64d(SEC.salt), iv = b64d(SEC.nonce), tag = b64d(SEC.tag), ct = b64d(SEC.ct);
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: SEC.iter, hash: 'SHA-256' }, baseKey, 256);
    const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const buf = new Uint8Array(ct.length + tag.length);
    buf.set(ct, 0); buf.set(tag, ct.length);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, key, buf);
    const P = JSON.parse(new TextDecoder().decode(pt));
    document.title = P.title;
    document.getElementById('app').innerHTML = P.html;
    EV = P.events;
    document.getElementById('lock').style.display = 'none';
    start();
  } catch (e) {
    err.textContent = '🔒 密钥错误，请重试';
  }
}
document.getElementById('unlockbtn').onclick = unlock;
document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

function renderEvent(i) {
  idx = Math.max(0, Math.min(EV.length - 1, i));
  const ev = EV[idx];
  ['', '2'].forEach(sfx => {
    const g = id => document.getElementById(id + sfx);
    if (!g('evi')) return;
    g('evi').textContent = idx + 1;
    const b = g('evsev');
    b.textContent = ev.sev;
    b.style.background = ev.sev === '严重' ? '#d1242f' : ev.sev === '中等' ? '#e8590c' : '#f0a020';
    g('evlabel').textContent = ev.label;
    g('evdate').textContent = ev.d0 + ' ~ ' + ev.d1;
    if (g('evsig')) g('evsig').textContent = '冲突信号 ' + ev.sig_n + ' 条';
  });
  document.querySelectorAll('.vrow').forEach(r => r.classList.toggle('active', +r.dataset.i === idx));
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === EV.length - 1;

  const box = document.getElementById('msgs');
  let html = '';
  let lastDay = '';
  let sigIdx = 0;
  ev.chat.forEach(m => {
    const day = m.t.slice(0, 5);
    if (day !== lastDay) { html += '<div class="daysep">' + day + '</div>'; lastDay = day; }
    if (m.who === 'sys') {
      html += '<div class="row sys"><div class="bub">' + m.text + '</div></div>';
    } else {
      const kw = m.kw.length ? '<div class="kws">' + m.kw.map(k => '<span class="kw">' + k + '</span>').join('') + '</div>' : '';
      const sig = m.sig ? '<div class="sigline"></div>' : '';
      const id = m.sig ? ' id="sig-' + (sigIdx++) + '"' : '';
      html += '<div class="row ' + m.who + '"' + id + '>' +
        (m.who === 'them' ? '<div class="ava2">温</div>' : '<div class="ava2 me">我</div>') +
        '<div class="bub">' + m.text + kw + sig + '</div></div>';
    }
  });
  box.innerHTML = html;
  const s = box.querySelector('[id^="sig-"]');
  if (s) s.scrollIntoView({ block: 'center' });
  else box.scrollTop = box.scrollHeight;
}

function start() {
  document.getElementById('prev').onclick = () => renderEvent(idx - 1);
  document.getElementById('next').onclick = () => renderEvent(idx + 1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') renderEvent(idx - 1);
    if (e.key === 'ArrowRight') renderEvent(idx + 1);
  });
  document.querySelectorAll('.vrow').forEach(r => r.addEventListener('click', () => renderEvent(+r.dataset.i)));
  let tx = null;
  const screen = document.querySelector('.screen');
  screen.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; }, { passive: true });
  screen.addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 60) renderEvent(idx + (dx < 0 ? 1 : -1));
    tx = null;
  }, { passive: true });
  renderEvent(0);
}
</script></body></html>
