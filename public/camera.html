<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steel Ball Camera</title>
  <style>
:root {
  color-scheme: dark;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #111417;
  color: #eef2f5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 960px;
  overflow: hidden;
}

button,
select,
input {
  font: inherit;
}

#app {
  height: 100dvh;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: #171b1f;
}

.topbar {
  min-height: 68px;
  display: grid;
  grid-template-columns: minmax(230px, 340px) minmax(0, 1fr);
  gap: 14px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #2b3239;
  background: #111417;
}

.brand {
  min-width: 0;
}

.title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0;
}

.model-text {
  margin-top: 3px;
  color: #8f9aa4;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.controls {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

button,
select,
.file-button,
.slider,
.rate {
  height: 36px;
  border: 1px solid #37404a;
  border-radius: 6px;
  background: #20262d;
  color: #eef2f5;
}

button,
.file-button {
  min-width: 82px;
  padding: 0 12px;
  cursor: pointer;
}

button:hover:not(:disabled),
.file-button:hover {
  background: #2f6e91;
  border-color: #3f8eb9;
}

button:disabled {
  cursor: not-allowed;
  color: #7e8993;
  background: #1a1f25;
}

select {
  width: min(230px, 20vw);
  padding: 0 10px;
}

.file-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
}

.file-button input {
  display: none;
}

.slider,
.rate {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 9px;
}

.slider span,
.rate span {
  color: #aab4bd;
  font-size: 12px;
  white-space: nowrap;
}

.slider input {
  width: 112px;
  accent-color: #24d18f;
}

.slider strong {
  width: 34px;
  text-align: right;
  font-size: 12px;
}

.rate input {
  width: 54px;
  height: 26px;
  border: 1px solid #3a424b;
  border-radius: 4px;
  background: #151a1f;
  color: #eef2f5;
  padding: 0 6px;
}

.workspace {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 250px;
}

.stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: #080b0e;
  overflow: hidden;
}

video {
  display: none;
}

#preview {
  display: block;
  width: 100%;
  height: 100%;
  background: #080b0e;
}

.empty-state {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #7e8993;
  font-size: 14px;
  pointer-events: none;
}

.empty-state[hidden] {
  display: none;
}

.metrics {
  min-height: 0;
  border-left: 1px solid #2b3239;
  background: #111417;
  padding: 10px;
  display: grid;
  grid-auto-rows: min-content;
  gap: 8px;
}

.metric {
  min-height: 54px;
  border: 1px solid #2e363e;
  border-radius: 6px;
  background: #1a1f25;
  padding: 8px 10px;
  display: grid;
  align-content: center;
  gap: 4px;
}

.metric span {
  color: #8f9aa4;
  font-size: 12px;
}

.metric strong {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0;
  color: #f4f7fa;
  overflow-wrap: anywhere;
}

.status {
  min-height: 42px;
  border: 1px solid #2e363e;
  border-radius: 6px;
  padding: 10px;
  color: #aab4bd;
  background: #171c22;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.status.busy {
  border-color: #476f81;
  color: #9ed7ec;
}

.status.ready {
  border-color: #2e6b50;
  color: #73e2ac;
}

.status.error {
  border-color: #8d3d44;
  color: #ff8e98;
}

@media (max-width: 1100px) {
  body {
    min-width: 0;
  }

  .topbar {
    grid-template-columns: 1fr;
  }

  .controls {
    justify-content: flex-start;
    flex-wrap: wrap;
  }

  .workspace {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) auto;
  }

  .metrics {
    border-left: 0;
    border-top: 1px solid #2b3239;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .status {
    grid-column: 1 / -1;
  }
}

  </style>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
export {};
const app = document.querySelector("#app");
if (!app)
  throw new Error("Missing app root");
app.innerHTML = `
  <header class="topbar">
    <div class="brand">
      <div class="title">Steel Ball Camera</div>
      <div id="modelText" class="model-text">选择 .onnx 模型</div>
    </div>
    <div class="controls">
      <select id="cameraSelect" aria-label="camera"></select>
      <button id="cameraBtn" type="button">打开相机</button>
      <label class="file-button">
        <input id="modelFile" type="file" accept=".onnx,application/octet-stream">
        选择ONNX
      </label>
      <button id="runBtn" type="button" disabled>开始</button>
      <label class="slider">
        <span>置信度</span>
        <input id="confInput" type="range" min="0.05" max="0.95" step="0.05" value="0.60">
        <strong id="confText">0.60</strong>
      </label>
      <label class="rate">
        <span>目标FPS</span>
        <input id="targetFpsInput" type="number" min="1" max="60" step="1" value="15">
      </label>
    </div>
  </header>
  <main class="workspace">
    <section class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="preview"></canvas>
      <div id="emptyState" class="empty-state">等待相机和模型</div>
    </section>
    <aside class="metrics">
      <div class="metric">
        <span>相机FPS</span>
        <strong id="cameraFps">0.0</strong>
      </div>
      <div class="metric">
        <span>推理FPS</span>
        <strong id="inferFps">0.0</strong>
      </div>
      <div class="metric">
        <span>延迟</span>
        <strong id="latencyText">--</strong>
      </div>
      <div class="metric">
        <span>框数</span>
        <strong id="boxText">0</strong>
      </div>
      <div class="metric">
        <span>分辨率</span>
        <strong id="resolutionText">--</strong>
      </div>
      <div class="metric">
        <span>后端</span>
        <strong id="backendText">--</strong>
      </div>
      <div id="statusText" class="status">idle</div>
    </aside>
  </main>
`;
const video = document.querySelector("#video");
const preview = document.querySelector("#preview");
const previewCtx = preview.getContext("2d");
const emptyState = document.querySelector("#emptyState");
const cameraSelect = document.querySelector("#cameraSelect");
const cameraBtn = document.querySelector("#cameraBtn");
const modelFile = document.querySelector("#modelFile");
const runBtn = document.querySelector("#runBtn");
const confInput = document.querySelector("#confInput");
const confText = document.querySelector("#confText");
const targetFpsInput = document.querySelector("#targetFpsInput");
const modelText = document.querySelector("#modelText");
const cameraFpsEl = document.querySelector("#cameraFps");
const inferFpsEl = document.querySelector("#inferFps");
const latencyText = document.querySelector("#latencyText");
const boxText = document.querySelector("#boxText");
const resolutionText = document.querySelector("#resolutionText");
const backendText = document.querySelector("#backendText");
const statusText = document.querySelector("#statusText");
const ortVersion = "1.22.0";
const modelSize = 1280;
const inputCanvas = document.createElement("canvas");
inputCanvas.width = modelSize;
inputCanvas.height = modelSize;
const rawInputCtx = inputCanvas.getContext("2d", { willReadFrequently: true });
if (!rawInputCtx)
  throw new Error("Missing preprocessing canvas");
const inputCtx = rawInputCtx;
inputCtx.imageSmoothingEnabled = true;
inputCtx.imageSmoothingQuality = "high";
const inputData = new Float32Array(3 * modelSize * modelSize);
let session = null;
let stream = null;
let running = false;
let inferBusy = false;
let lastInferStart = 0;
let detections = [];
let frameCount = 0;
let inferCount = 0;
let lastFrameFpsAt = performance.now();
let lastInferFpsAt = performance.now();
let canvasCss = { w: 1, h: 1 };
function setStatus(text, mode = "idle") {
  statusText.textContent = text;
  statusText.className = `status ${mode}`;
}
function formatBytes(bytes) {
  if (bytes < 1024 * 1024)
    return `${Math.round(bytes / 1024)}KB`;
  return `${(bytes / (1024 * 1024)).toFixed(1)}MB`;
}
async function listCameras() {
  if (!navigator.mediaDevices?.enumerateDevices)
    return;
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cameras = devices.filter((device) => device.kind === "videoinput");
  cameraSelect.innerHTML = cameras.map((device, index) => `<option value="${device.deviceId}">${device.label || `Camera ${index + 1}`}</option>`).join("");
  if (!cameraSelect.innerHTML) {
    cameraSelect.innerHTML = `<option value="">Default camera</option>`;
  }
}
async function startCamera() {
  if (!window.isSecureContext) {
    throw new Error("相机需要 HTTPS 或 file:// 安全上下文");
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error("当前浏览器没有 getUserMedia");
  }
  stream?.getTracks().forEach((track) => track.stop());
  const deviceId = cameraSelect.value;
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: {
      deviceId: deviceId ? { exact: deviceId } : undefined,
      facingMode: deviceId ? undefined : { ideal: "environment" },
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: 60 }
    }
  });
  video.srcObject = stream;
  await video.play();
  await listCameras();
  emptyState.hidden = true;
  cameraBtn.textContent = "切换相机";
  setStatus("camera ready", "ready");
  updateRunEnabled();
}
async function createSession(modelBytes) {
  ort.env.wasm.wasmPaths = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ortVersion}/dist/`;
  const providers = "gpu" in navigator ? ["webgpu", "wasm"] : ["wasm"];
  let lastError = null;
  for (const provider of providers) {
    try {
      const loaded = await ort.InferenceSession.create(modelBytes, {
        executionProviders: [provider],
        graphOptimizationLevel: "all"
      });
      return { session: loaded, backend: provider };
    } catch (error) {
      lastError = error;
    }
  }
  throw lastError instanceof Error ? lastError : new Error("模型加载失败");
}
async function loadModelFromFile(file) {
  running = false;
  runBtn.textContent = "开始";
  runBtn.disabled = true;
  session = null;
  detections = [];
  backendText.textContent = "--";
  modelText.textContent = `${file.name} / ${formatBytes(file.size)}`;
  setStatus("loading model", "busy");
  const bytes = new Uint8Array(await file.arrayBuffer());
  const loaded = await createSession(bytes);
  session = loaded.session;
  backendText.textContent = loaded.backend;
  setStatus("model ready", "ready");
  updateRunEnabled();
}
function updateRunEnabled() {
  runBtn.disabled = !session || !video.videoWidth;
}
function confidence() {
  return Number(confInput.value);
}
function targetIntervalMs() {
  const fps = Math.min(60, Math.max(1, Number(targetFpsInput.value) || 15));
  return 1000 / fps;
}
function makeLetterbox() {
  const sourceW = video.videoWidth || 1;
  const sourceH = video.videoHeight || 1;
  const scale = Math.min(modelSize / sourceW, modelSize / sourceH);
  const drawW = Math.round(sourceW * scale);
  const drawH = Math.round(sourceH * scale);
  const padX = Math.floor((modelSize - drawW) / 2);
  const padY = Math.floor((modelSize - drawH) / 2);
  inputCtx.fillStyle = "#000000";
  inputCtx.fillRect(0, 0, modelSize, modelSize);
  inputCtx.drawImage(video, 0, 0, sourceW, sourceH, padX, padY, drawW, drawH);
  return { scale, padX, padY, sourceW, sourceH };
}
function preprocess() {
  const letterbox = makeLetterbox();
  const pixels = inputCtx.getImageData(0, 0, modelSize, modelSize).data;
  const plane = modelSize * modelSize;
  for (let rgba = 0, px = 0;rgba < pixels.length; rgba += 4, px += 1) {
    inputData[px] = pixels[rgba] / 255;
    inputData[plane + px] = pixels[rgba + 1] / 255;
    inputData[plane * 2 + px] = pixels[rgba + 2] / 255;
  }
  return letterbox;
}
function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}
function parseDetections(output, letterbox) {
  const raw = output.data;
  const stride = output.dims.at(-1) ?? 6;
  const rows = Math.floor(raw.length / stride);
  const result = [];
  const conf = confidence();
  for (let row = 0;row < rows; row += 1) {
    const offset = row * stride;
    const score = Number(raw[offset + 4]);
    if (!Number.isFinite(score) || score < conf)
      continue;
    let x1 = Number(raw[offset]);
    let y1 = Number(raw[offset + 1]);
    let x2 = Number(raw[offset + 2]);
    let y2 = Number(raw[offset + 3]);
    if (![x1, y1, x2, y2].every(Number.isFinite))
      continue;
    if (Math.max(Math.abs(x1), Math.abs(y1), Math.abs(x2), Math.abs(y2)) <= 2) {
      x1 *= modelSize;
      y1 *= modelSize;
      x2 *= modelSize;
      y2 *= modelSize;
    }
    const left = clamp((x1 - letterbox.padX) / letterbox.scale, 0, letterbox.sourceW);
    const top = clamp((y1 - letterbox.padY) / letterbox.scale, 0, letterbox.sourceH);
    const right = clamp((x2 - letterbox.padX) / letterbox.scale, 0, letterbox.sourceW);
    const bottom = clamp((y2 - letterbox.padY) / letterbox.scale, 0, letterbox.sourceH);
    if (right - left < 2 || bottom - top < 2)
      continue;
    result.push({ x1: left, y1: top, x2: right, y2: bottom, score });
  }
  return result.sort((a, b) => b.score - a.score);
}
async function runInference() {
  if (!session || !video.videoWidth)
    return;
  inferBusy = true;
  const start = performance.now();
  try {
    const letterbox = preprocess();
    const tensor = new ort.Tensor("float32", inputData, [1, 3, modelSize, modelSize]);
    const outputMap = await session.run({ [session.inputNames[0]]: tensor });
    const output = outputMap[session.outputNames[0]];
    detections = parseDetections(output, letterbox);
    const latencyMs = performance.now() - start;
    inferCount += 1;
    boxText.textContent = String(detections.length);
    latencyText.textContent = `${latencyMs.toFixed(1)}ms`;
    setStatus(running ? "running" : "ready", running ? "busy" : "ready");
  } catch (error) {
    running = false;
    runBtn.textContent = "开始";
    setStatus(error instanceof Error ? error.message : "inference failed", "error");
  } finally {
    inferBusy = false;
  }
}
function resizePreview() {
  const rect = preview.getBoundingClientRect();
  const w = Math.max(320, Math.floor(rect.width));
  const h = Math.max(240, Math.floor(rect.height));
  if (canvasCss.w === w && canvasCss.h === h)
    return;
  canvasCss = { w, h };
  const ratio = window.devicePixelRatio || 1;
  preview.width = Math.floor(w * ratio);
  preview.height = Math.floor(h * ratio);
  previewCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
function displayRect() {
  const sourceW = video.videoWidth || 16;
  const sourceH = video.videoHeight || 9;
  const scale = Math.min(canvasCss.w / sourceW, canvasCss.h / sourceH);
  const w = sourceW * scale;
  const h = sourceH * scale;
  return {
    x: (canvasCss.w - w) / 2,
    y: (canvasCss.h - h) / 2,
    w,
    h,
    scale
  };
}
function drawScene() {
  resizePreview();
  previewCtx.clearRect(0, 0, canvasCss.w, canvasCss.h);
  previewCtx.fillStyle = "#080b0e";
  previewCtx.fillRect(0, 0, canvasCss.w, canvasCss.h);
  if (!video.videoWidth)
    return;
  const rect = displayRect();
  previewCtx.drawImage(video, rect.x, rect.y, rect.w, rect.h);
  previewCtx.lineWidth = 2;
  previewCtx.font = "12px ui-sans-serif, system-ui";
  previewCtx.textBaseline = "top";
  for (const box of detections) {
    const x = rect.x + box.x1 * rect.scale;
    const y = rect.y + box.y1 * rect.scale;
    const w = (box.x2 - box.x1) * rect.scale;
    const h = (box.y2 - box.y1) * rect.scale;
    previewCtx.strokeStyle = "#24d18f";
    previewCtx.fillStyle = "rgba(36, 209, 143, 0.14)";
    previewCtx.fillRect(x, y, w, h);
    previewCtx.strokeRect(x, y, w, h);
    const label = `${Math.round(box.score * 100)}%`;
    const labelW = previewCtx.measureText(label).width + 10;
    previewCtx.fillStyle = "#24d18f";
    previewCtx.fillRect(x, Math.max(0, y - 20), labelW, 18);
    previewCtx.fillStyle = "#06110d";
    previewCtx.fillText(label, x + 5, Math.max(2, y - 18));
  }
}
function updateFps(now) {
  frameCount += 1;
  if (now - lastFrameFpsAt >= 1000) {
    const fps = frameCount * 1000 / (now - lastFrameFpsAt);
    cameraFpsEl.textContent = fps.toFixed(1);
    frameCount = 0;
    lastFrameFpsAt = now;
  }
  if (now - lastInferFpsAt >= 1000) {
    const fps = inferCount * 1000 / (now - lastInferFpsAt);
    inferFpsEl.textContent = fps.toFixed(1);
    inferCount = 0;
    lastInferFpsAt = now;
  }
}
function tick(now) {
  updateFps(now);
  if (video.videoWidth) {
    resolutionText.textContent = `${video.videoWidth}x${video.videoHeight}`;
    updateRunEnabled();
  }
  if (running && session && !inferBusy && now - lastInferStart >= targetIntervalMs()) {
    lastInferStart = now;
    runInference();
  }
  drawScene();
  requestAnimationFrame(tick);
}
cameraBtn.addEventListener("click", () => {
  setStatus("opening camera", "busy");
  startCamera().catch((error) => setStatus(error instanceof Error ? error.message : "camera failed", "error"));
});
modelFile.addEventListener("change", () => {
  const file = modelFile.files?.[0];
  if (!file)
    return;
  loadModelFromFile(file).catch((error) => setStatus(error instanceof Error ? error.message : "model failed", "error"));
});
runBtn.addEventListener("click", () => {
  running = !running;
  runBtn.textContent = running ? "暂停" : "开始";
  setStatus(running ? "running" : "ready", running ? "busy" : "ready");
});
confInput.addEventListener("input", () => {
  confText.textContent = Number(confInput.value).toFixed(2);
});
cameraSelect.addEventListener("change", () => {
  if (stream) {
    startCamera().catch((error) => setStatus(error instanceof Error ? error.message : "camera failed", "error"));
  }
});
window.addEventListener("resize", resizePreview);
listCameras().catch((error) => setStatus(error instanceof Error ? error.message : "init failed", "error"));
requestAnimationFrame(tick);

  </script>
</body>
</html>
