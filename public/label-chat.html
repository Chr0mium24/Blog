<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Label Chat — AI 标签排版（纯前端版）</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#14161a; --panel:#1c1f26; --line:#2a2f3a; --fg:#e8eaf0; --dim:#8b93a5; --acc:#4f8cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; height:100vh; display:flex; }
  #chat { width:38%; min-width:340px; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #chat header { padding:10px 14px; border-bottom:1px solid var(--line); color:var(--dim); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #msgs { flex:1; overflow-y:auto; padding:14px; }
  .m { margin:10px 0; max-width:92%; }
  .m.user { margin-left:auto; background:var(--acc); color:#fff; padding:8px 12px; border-radius:12px 12px 2px 12px; white-space:pre-wrap; }
  .m.ai { background:var(--panel); padding:8px 12px; border-radius:12px 12px 12px 2px; white-space:pre-wrap; }
  .m img.thumb { height:60px; margin-top:6px; border-radius:6px; display:block; }
  .m small { color:var(--dim); display:block; margin-top:6px; }
  #attach { display:flex; gap:6px; flex-wrap:wrap; padding:0 12px; }
  #attach img { height:52px; border-radius:6px; border:1px solid var(--line); cursor:pointer; }
  #inputbar { padding:12px; border-top:1px solid var(--line); display:flex; gap:8px; }
  textarea#msg { flex:1; height:84px; resize:none; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .chip { color:var(--acc); cursor:pointer; font-size:12px; }
  #preview { flex:1; display:flex; flex-direction:column; }
  #preview header { padding:10px 14px; border-bottom:1px solid var(--line); color:var(--dim); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #preview header button { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:4px 10px; font-size:12px; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:16px; }
  canvas#png { max-width:100%; max-height:100%; background:#fff; box-shadow:0 4px 24px rgba(0,0,0,.4); }
  #jsonwrap { height:30%; border-top:1px solid var(--line); display:flex; flex-direction:column; }
  #jsonwrap header { padding:6px 12px; color:var(--dim); border-bottom:1px solid var(--line); font-size:12px; display:flex; justify-content:space-between; }
  #spec { flex:1; background:var(--panel); color:#cdd6e4; border:0; padding:10px; font:12px/1.5 ui-monospace,Menlo,monospace; resize:none; outline:none; }
  #settings { position:fixed; right:12px; top:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; width:280px; z-index:9; transition:all .2s; }
  #settings.collapsed { width:52px; padding:8px; overflow:hidden; }
  #settings.collapsed :not(#gear):not(#gear *) { display:none; }
  #settings.collapsed #gear { display:block !important; margin:0 auto; }
  #gear { position:sticky; float:right; margin-left:6px; background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:6px; width:26px; height:26px; line-height:24px; text-align:center; cursor:pointer; }
  #settings h4 { font-size:12px; color:var(--dim); margin-bottom:6px; }
  #settings input, #settings select { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; margin:3px 0; font-size:12px; }
  label { font-size:11px; color:var(--dim); }
  .warn { color:#ffb84f; font-size:11px; line-height:1.4; }
  #overlay .handle { position:absolute; pointer-events:auto; cursor:move; border:1.5px dashed rgba(0,120,255,.9); background:rgba(90,150,255,.15); box-sizing:border-box; }
  #overlay .handle.sel { border-color:#ff6b3d; background:rgba(255,120,60,.2); }
</style>
</head>
<body>
  <div id="settings">
    <span id="gear" onclick="toggleSettings()">⚙</span>
    <h4>API 设置（只存在本机 localStorage）</h4>
    <label>服务</label>
    <select id="prov" onchange="saveCfg()">
      <option value="ds">DeepSeek 官方（便宜，纯文本）</option>
      <option value="or">OpenRouter（多模型，可看图）</option>
    </select>
    <label>文字模型</label>
    <input id="mText" oninput="saveCfg()" placeholder="deepseek-flash">
    <label>视觉模型（发图时用）</label>
    <input id="mVis" oninput="saveCfg()" placeholder="qwen/qwen3-vl-…:free">
    <label>思考档位（越低越快）</label>
    <select id="think" onchange="saveCfg()">
      <option value="">不思考（最快）</option>
      <option value="low">low</option>
      <option value="high">high</option>
    </select>
    <label>API Key</label>
    <input id="key" type="password" oninput="saveCfg()" placeholder="sk-…">
    <div class="warn">⚠ Key 只存你浏览器 localStorage、不进代码库；但纯前端调用意味着请求从你浏览器带 Key 发出，请勿用多人电脑。</div>
  </div>
  <div id="chat">
    <header>💬 排版助手
      <span class="chip" onclick="loadDemo('sn1')">流水号示例</span>
      <span class="chip" onclick="loadDemo('mk')">美客美家示例</span>
      <span class="chip" style="color:#ffb84f" onclick="showBtw()">📦 btw 工具</span>
    </header>
    <div id="msgs"></div>
    <div id="attach"></div>
    <div id="inputbar">
      <textarea id="msg" placeholder="描述需求 / 粘贴截图 / 拖入图片或 btw 文件"></textarea>
      <button id="send" onclick="send()">发送<br><span style="font-size:10px">⌘⏎</span></button>
    </div>
  </div>
  <div id="preview">
    <header>🖨 预览（203dpi 实打印像素）
      <button onclick="renderSpec()">用当前 JSON 渲染</button>
      <button onclick="exportPng()">导出 PNG</button>
      <button onclick="exportJson()">保存 JSON</button>
      <button onclick="exportBtw()" style="color:#ffb84f">⬇ 下载 .btw</button>
      <button onclick="toggleEdit()" id="editBtn">✋ 编辑</button>
      <span id="status" style="margin-left:auto"></span>
    </header>
    <div id="stage"><div id="cwrap" style="position:relative"><canvas id="png"></canvas><div id="overlay" style="position:absolute;left:0;top:0;pointer-events:none"></div></div></div>
    <div id="jsonwrap">
      <header><span>label.json（可直接改）</span><span id="size"></span></header>
      <textarea id="spec" spellcheck="false"></textarea>
    </div>
  </div>

<script>
/* ============ 配置 ============ */
function toggleSettings() {
  document.getElementById('settings').classList.toggle('collapsed');
}
const cfg = () => ({
  prov: localStorage.lc_prov || 'ds',
  mText: localStorage.lc_mText || 'deepseek-flash',
  mVis: localStorage.lc_mVis || '',
  think: localStorage.lc_think ?? '',
  key: localStorage.lc_key || '',
});
function saveCfg(){
  localStorage.lc_prov = document.getElementById('prov').value;
  localStorage.lc_mText = document.getElementById('mText').value;
  localStorage.lc_mVis = document.getElementById('mVis').value;
  localStorage.lc_key = document.getElementById('key').value;
  localStorage.lc_think = document.getElementById('think').value;
}
function initCfg(){
  const c = cfg();
  document.getElementById('prov').value = c.prov;
  document.getElementById('mText').value = c.mText; document.getElementById('mText').placeholder = 'deepseek-flash（文本+看图一体）';
  document.getElementById('mVis').value = c.mVis;
  document.getElementById('think').value = c.think;
  document.getElementById('key').value = c.key;
}
function endpoint(){
  const c = cfg();
  return c.prov === 'ds' ? 'https://api.deepseek.com/chat/completions' : 'https://openrouter.ai/api/v1/chat/completions';
}

/* ============ 系统指令 ============ */
const SPEC = `# Label Format v1 — AI 排版指令（instruction）
坐标/尺寸一律毫秒mm，原点标签左上角，打印分辨率 203dpi（1mm≈8px），纯黑白。
## Schema
{ "version":1, "size":{"w":100.0,"h":60.0},
  "objects": [...],
  "variables": { "字段":"值", "sn":{"mode":"serial","start":1,"total":200} } }
## objects
- box: x,y,w,h 必填; radius(圆角mm默认0), line(线宽mm默认0.3)
- text: x,y,text 必填; w(限宽mm,超出自动缩字号), font(hei黑/song宋,默认song), size(字高mm默认4), bold(默认true), align(left默认/center/right,center|right需给w)
- barcode: x,y,data,h(条高mm) 必填; module(窄条mm默认0.4), showtext(默认true); Code39,A-Z 0-9 -.$/+% 空格
- image: x,y,src,w|h (src 为文件名,占位渲染)
变量: text/data 里 {name}; serial 自动产出 {sn} 与 {sn_total},{total}
## 约束
1. 字号≥2mm 2. 行距=size+2mm左右 3. 文本不越 margin.left(默认5mm) 4. 源边框用 box(radius 1~3mm, line 0.15~0.35)
5. text 中用到 {x} 的每个 x 必须在 variables 中定义 (sn_total 除外,自动产出)
## 工作流
用户给文案/图片时: 逐行定y(首行 y≈margin+3, 之后按行距), 数字/日期抽成 variables, 批次/流水号→serial, 自检约束后只输出一个完整 JSON（\`\`\`json 代码块内, 块外最多一句话）。
看图任务: 尺寸按图比例估算(默认100×60), 文字逐行抄录, 条码→barcode(data=条码下方文字), 图案→说明用户可后续补原图。`;

/* ============ 渲染器 (canvas, 203dpi) ============ */
const DPI = 203, PX = DPI / 25.4;
const mm = v => v * PX;
function fontStr(name, sizeMm, bold) {
  const px = Math.max(6, Math.round(mm(sizeMm) * 1.05));
  const fam = name === 'hei' ? '"SimHei","Heiti SC",sans-serif' : '"SimSun","Songti SC",serif';
  return `${bold ? 'bold ' : ''}${px}px ${fam}, serif`;
}
const SUBST = (text, vals) => Object.entries(vals || {}).reduce((t, [k, v]) => t.replaceAll(`{${k}}`, v), text);
function resolve(spec) {
  const vals = {}, cli = window.__vars || {};
  const specVars = spec.variables || {};
  let firstTotal = null;
  for (const [k, v] of Object.entries(specVars)) {
    if (typeof v === 'object' && v.mode === 'serial') {
      vals[k] = cli[k] ?? v.start ?? 1;
      vals[k + '_total'] = v.total ?? 1;
      firstTotal ??= vals[k + '_total'];
    } else vals[k] = cli[k] ?? v;
  }
  Object.assign(vals, Object.fromEntries(Object.entries(cli).filter(([k]) => !(k in vals))));
  if (firstTotal != null && !('total' in vals)) vals.total = firstTotal;
  return vals;
}
function drawCode39(ctx, x, y, data, hMm, modMm = 0.4, showtext = true) {
  const T = {"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn","A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn","F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn","K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn","P":"nnwnwnnwn","Q":"nnnnnwwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn","U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn","Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","$":"nwnwnwnnn","/":"nwnwnnnwn","+":"nwnnnwnwn","%":"nnnwnwnwn","*":"nwnnwnwnn"};
  data = ('*' + data.toUpperCase() + '*');
  if (![...data].every(c => T[c])) throw new Error('Code39 字符不合法: ' + data);
  const u = mm(modMm);
  let cx = x;
  ctx.fillStyle = '#000';
  for (const ch of data) {
    const pat = T[ch];
    for (let i = 0; i < 9; i++) {
      const w = (pat[i] === 'w' ? 3 : 1) * u;
      if (i % 2 === 0) ctx.fillRect(cx, y, w, mm(hMm)); // i%2==0 → bar
      cx += w;
    }
    cx += u;
  }
  if (showtext) {
    ctx.font = '13px Arial, sans-serif';
    ctx.fillText(data, x, y + mm(hMm) + 14);
  }
}
function renderSpecTo(spec) {
  const w = Math.round(mm(spec.size.w)), h = Math.round(mm(spec.size.h));
  const c = document.getElementById('png');
  c.width = w; c.height = h;
  c.style.aspectRatio = `${w}/${h}`;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  const vals = resolve(spec);
  for (const ob of spec.objects || []) {
    const t = ob.type, x = mm(ob.x), y = mm(ob.y);
    try {
      if (t === 'box') {
        ctx.beginPath();
        ctx.lineWidth = Math.max(1, mm(ob.line ?? 0.3));
        ctx.strokeStyle = '#000';
        ctx.roundRect(x, y, mm(ob.w), mm(ob.h), mm(ob.radius ?? 0));
        ctx.stroke();
      } else if (t === 'text') {
        const text = SUBST(ob.text || '', vals);
        let size = ob.size ?? 4;
        ctx.font = fontStr(ob.font ?? 'song', size, ob.bold ?? true);
        if (ob.w) { // 限宽自动缩字号
          while (ctx.measureText(text).width > mm(ob.w) && size > 1.5) {
            size -= 0.2;
            ctx.font = fontStr(ob.font ?? 'song', size, ob.bold ?? true);
          }
        }
        let tx = x;
        if ((ob.align === 'center' || ob.align === 'right') && ob.w) {
          const tw = ctx.measureText(text).width;
          tx += ob.align === 'center' ? (mm(ob.w) - tw) / 2 : mm(ob.w) - tw;
        }
        ctx.fillStyle = '#000';
        ctx.textBaseline = 'top';
        ctx.fillText(text, tx, y);
      } else if (t === 'barcode') {
        drawCode39(ctx, x, y, SUBST(ob.data, vals), ob.h, ob.module ?? 0.4, ob.showtext ?? true);
      } else if (t === 'image') {
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        ctx.strokeRect(x, y, mm(ob.w ?? 25), mm(ob.h ?? 10));
        ctx.font = '12px Arial'; ctx.fillText(`[图:${ob.src}]`, x + 4, y + 16);
      }
    } catch (e) { console.warn('对象跳过', ob.type, e); }
  }
  const spec0 = { size: spec.size };
  document.getElementById('size').textContent = `${spec.size.w}×${spec.size.h}mm → ${w}×${h}px`;
}
function renderSpec(quiet) {
  try {
    const spec = JSON.parse(document.getElementById('spec').value);
    renderSpecTo(spec);
    if (!quiet) document.getElementById('status').textContent = '渲染 ✓ ' + new Date().toLocaleTimeString();
  } catch (e) { document.getElementById('status').textContent = 'JSON/渲染错误: ' + e.message; }
}
function exportPng() {
  const c = document.getElementById('png');
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = 'label.png'; a.click();
}
function exportJson() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(document.getElementById('spec').value);
  a.download = 'label.json'; a.click();
}

/* ============ btw 工具 (纯 JS 写回器) ============ */
async function showBtw() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.btw';
  inp.onchange = async () => inp.files[0] && btwFlow(inp.files[0]);
  inp.click();
}
async function zlibDecompress(u8) {
  const ds = new DecompressionStream('deflate');
  const res = new Response(new Blob([u8]).stream().pipeThrough(ds));
  return new Uint8Array(await res.arrayBuffer());
}
async function zlibCompress(u8) {
  const cs = new CompressionStream('deflate');
  const res = new Response(new Blob([u8]).stream().pipeThrough(cs));
  return new Uint8Array(await res.arrayBuffer());
}
async function firstZlibStream(data) {
  for (let i = 0; i < data.length - 2; i++) {
    if (data[i] === 0x78 && (data[i+1] === 0x9c || data[i+1] === 0xda || data[i+1] === 0x01)) {
      try { await zlibDecompress(data.subarray(i)); return i; } catch (e) {}
    }
  }
  throw new Error('btw 里没找到 zlib 对象树');
}
function utf16Records(blob) {
  const out = [];
  let i = 0;
  while (i < blob.length - 4) {
    if (blob[i] === 0xFF && blob[i+1] === 0xFE && blob[i+2] === 0xFF) {
      const L = blob[i+3], end = i + 4 + 2 * L;
      if (end <= blob.length) {
        const s = new TextDecoder('utf-16le').decode(blob.subarray(i + 4, end));
        let ok = L === 0;
        try { ok = ok || [...s].every(c => c.isPrintable ? true : (c.codePointAt(0) > 31 || c === '\n')); } catch (e) {}
        ok = ok || [...s].every(c => { const p = c.codePointAt(0); return (p > 31 && p < 0xE000 && p !== 0x7F) || (p >= 0x3400 && p <= 0xFFFF); });
        if (ok) { out.push({ off: i, len: end - i, text: s }); i = end; continue; }
      }
    }
    i++;
  }
  return out;
}
const b16le = s => [...s].flatMap(c => { const h = c.charCodeAt(0).toString(16).padStart(4, '0'); return [h.slice(2), h.slice(0, 2)].map(x => parseInt(x, 16)); });
async function btwFlow(file) {
  const pairs = prompt('btw 内容替换（每行一条 旧=新）\n留空只解析:', '生产日期：2025.03.10=生产日期：2026.10.08');
  if (pairs === null) return;
  const edits = Object.fromEntries(pairs.split('\n').map(l => l.split('=', 2)).filter(a => a.length === 2 && a[0]));
  const buf = new Uint8Array(await file.arrayBuffer());
  const zs = await firstZlibStream(buf);
  const blob = await zlibDecompress(buf.subarray(zs));
  const recs = utf16Records(blob);
  const out = [], editsInfo = [];
  let last = 0;
  const done = new Set();
  for (const r of recs) {
    if (edits[r.text] !== undefined && !done.has(r.off)) {
      done.add(r.off);
      const nw = edits[r.text];
      editsInfo.push(`${r.text} → ${nw}`);
      out.push(blob.subarray(last, r.off));
      const head = [0xFF, 0xFE, 0xFF, nw.length];
      out.push(new Uint8Array([...head, ...b16le(nw)]));
      last = r.off + r.len;
    }
  }
  out.push(blob.subarray(last));
  const miss = Object.keys(edits).filter(k => !editsInfo.some(s => s.startsWith(k)));
  // 重组
  const parts = [buf.subarray(0, zs)];
  let total = 0;
  const newBlobParts = out;
  const newLen = newBlobParts.reduce((s, p) => s + p.length, 0);
  const compressed = await zlibCompress(newBlobParts);
  const dl = new Blob([...parts.filter(p => p.length), compressed], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(dl);
  a.download = file.name.replace(/\.btw$/i, '') + '_改.btw';
  a.click();
  alert(`处理完成:\n${editsInfo.join('\n') || '(无替换)'}\n${miss.length ? '未找到: ' + miss.join('、') : ''}\n旧对象树 ${blob.length}B → 新 ${newLen}B (压缩 ${compressed.length}B)\n请回到 Windows 端用 BarTender 验证打开.`);
}

/* ============ 聊天 ============ */
let history = [], pending = [];
const MSGS = document.getElementById('msgs');
function addMsg(role, text, images) {
  const d = document.createElement('div');
  d.className = 'm ' + role;
  if (text) d.textContent = text;
  (images || []).forEach(u => { const im = new Image(); im.src = u; im.className = 'thumb'; d.appendChild(im); });
  MSGS.appendChild(d); MSGS.scrollTop = MSGS.scrollHeight;
  return d;
}
function busy(t) { document.getElementById('status').textContent = t; }
function addAttach(dataUrl) {
  pending.push(dataUrl);
  const img = new Image(); img.src = dataUrl;
  img.onclick = () => { pending = pending.filter(x => x !== dataUrl); img.remove(); };
  document.getElementById('attach').appendChild(img);
}
function img2url(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image(); im.onload = () => {
      const c = document.createElement('canvas');
      const s = Math.min(1, 1200 / Math.max(im.width, im.height));
      c.width = im.width * s; c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.85));
    }; im.src = r.result;
  };
  r.readAsDataURL(file);
}
document.addEventListener('paste', e => {
  if (!e.clipboardData) return;
  for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) img2url(it.getAsFile(), addAttach);
});
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault();
  for (const f of e.dataTransfer.files) {
    if (f.type.startsWith('image/')) img2url(f, addAttach);
    else if (f.name.toLowerCase().endsWith('.btw')) btwFlow(f);
  }
});
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') send(); });

async function send() {
  const c = cfg();
  if (!c.key) { busy('⚙️ 请先填 API Key（右上角设置）'); return; }
  const box = document.getElementById('msg');
  const text = box.value.trim();
  const withImgs = pending.slice(); pending = [];
  document.getElementById('attach').innerHTML = '';
  if (!text && !withImgs.length) return;
  box.value = '';
  addMsg('user', text || '(发了图片)', withImgs);
  const um = { role: 'user', content: text || '请按图排一版。' };
  if (withImgs.length) {
    if (c.prov === 'ds') {  // DeepSeek 官方暂无视觉模型 → 有图自动切 OpenRouter
      um.images = withImgs;
      addMsg('ai', 'ℹ️ 检测到图片，DeepSeek 官方模型不支持视觉。若「视觉模型」未填或仍选 DeepSeek，将按文字处理。');
    }
  }
  history.push(um);
  const wait = addMsg('ai', '⏳ 生成中…');
  document.getElementById('send').disabled = true;
  try {
    const useVis = withImgs.length > 0;
    const model = (useVis && c.prov === 'or' && c.mVis) ? c.mVis : c.mText;
    const provUrl = endpoint();
    const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key };
    if (provUrl.includes('openrouter')) { headers['HTTP-Referer'] = location.origin; headers['X-Title'] = 'Label Chat'; }
    const msgs = [{ role: 'system', content: SPEC }, ...history.map(m => {
      if (m.images) {
        return { role: m.role, content: [{ type: 'text', text: m.content }, ...m.images.map(u => ({ type: 'image_url', image_url: { url: u } }))] };
      }
      return m;
    })];
    const resp = await fetch(provUrl, {
      method: 'POST', headers,
      body: JSON.stringify(Object.assign({ model, messages: msgs, stream: true, temperature: 0.3 },
        cfg().think ? { thinking: { type: 'enabled' }, reasoning_effort: cfg().think } : { thinking: { type: 'disabled' } }))
    });
    if (!resp.ok) throw new Error(`API ${resp.status}: ${(await resp.text()).slice(0, 200)}`);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let acc = '', buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        if (!l.startsWith('data: ')) continue;
        const d = l.slice(6).trim();
        if (d === '[DONE]') continue;
        try {
          const j = JSON.parse(d);
          const delta = j.choices?.[0]?.delta?.content || '';
          if (delta) { acc += delta; wait.textContent = acc.replace(/```json|```/g, '').trim().slice(-400); MSGS.scrollTop = MSGS.scrollHeight; }
        } catch (e) {}
      }
    }
    history.push({ role: 'assistant', content: acc });
    const mm2 = acc.match(/```json\s*([\s\S]*?)```/) || acc.match(/(\{[\s\S]*\})/);
    let spec = mm2 && JSON.parse(mm2[1]);
    if (spec && spec.objects) {
      delete spec._preview;
      document.getElementById('spec').value = JSON.stringify(spec, null, 2);
      renderSpec(true);
      wait.appendChild(Object.assign(document.createElement('small'), { textContent: '✓ 已生成并渲染（右侧）' }));
      busy('就绪');
    } else {
      wait.appendChild(Object.assign(document.createElement('small'), { textContent: '⚠ 本轮没有可解析的 label.json' }));
      busy('⚠ 无 JSON');
    }
  } catch (e) {
    if (acc) history.pop();
    wait.textContent += '\n❌ ' + e.message;
    busy('出错');
  }
  document.getElementById('send').disabled = false;
}

// 段: {k:'s', t:text} | {k:'g', t:Uint8Array}
function segParse(blob) {
  const dec = new TextDecoder('utf-16le');
  const segs = [];
  let i = 0, gap = 0;
  while (i < blob.length - 4) {
    if (blob[i] === 0xFF && blob[i+1] === 0xFE && blob[i+2] === 0xFF) {
      const L = blob[i+3], end = i + 4 + 2 * L;
      if (end <= blob.length) {
        let ok = L === 0;
        try {
          const s = dec.decode(blob.subarray(i + 4, end));
          ok = L === 0 || [...s].every(c => (31 < c.codePointAt(0) && c.codePointAt(0) < 0xE000 && c !== "\u007f") || (c.codePointAt(0) >= 0x3400 && c.codePointAt(0) <= 0xFFFF));
          if (ok) {
            if (i > gap) segs.push({ k: 'g', t: blob.slice(gap, i), i: gap, e: i });
            segs.push({ k: 's', t: s, i, e: end });
            i = end; gap = end; continue;
          }
        } catch (e) {}
      }
    }
    i++;
  }
  const tail = blob.slice(gap);
  if (tail.length) segs.push({ k: 'g', t: tail, i: gap, e: blob.length });
  return segs;
}
function segRebuild(segs) {

    else {

      parts.push(u16);
    }
  }
  return concat(parts);
}
function utf16enc(str) {

  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    out[i*2] = c & 0xFF; out[i*2+1] = c >> 8;
  }
  return out;
}
function utf16dec(u8) {

  for (let i = 0; i + 1 < u8.length; i += 2) s += String.fromCharCode(u8[i] | (u8[i+1] << 8));

}

}

function findBlocks(segs) {
  const blocks = [];
  let cur = null;
  segs.forEach((s, k) => {
    if (s.k === 's' && s.t === 'DataSource') {
      if (cur) blocks.push(cur);
      cur = { s0: k, e: k, name: null, contents: [] };
    } else if (cur) {
      cur.e = k;
      if (s.k === 's') {
        if (!cur.name && NAME_RE.test(s.t)) cur.name = s.t;
        else if (cur.name && (!CONSTS.has(s.t) || s.t === '') && !NAME_RE.test(s.t)) cur.contents.push(k);
      }
    }

}

  let i = 0;
  while (i < raw.length) {
    const b = raw[i];

    let j = i;
    while (j + 1 < raw.length && raw[j + 1].name === b.name) {
      j++;
      o.e = raw[j].e;
      o.contents.push(...raw[j].contents);

}

function setGeo(segs, o, xMm, yMm) {
  const MIL = 1000 / 25.4;
  const xv = Math.round(xMm * MIL), yv = Math.round(yMm * MIL);
  for (let k = o.s0; k <= o.e; k++) {
    const s = segs[k];
    if (s.k === 'g' && s.t.length >= 8) {
      for (let g = 0; g + 8 <= s.t.length; g += 4) {
        const x = s.t[g] | (s.t[g+1] << 8) | (s.t[g+2] << 16) | (s.t[g+3] << 24);
        const y = s.t[g+4] | (s.t[g+5] << 8) | (s.t[g+6] << 16) | (s.t[g+7] << 24);
        if (-20 <= x && x <= 20000 && -20 <= y && y <= 20000 && !(x === 0 && y === 0)) {
          const nx = new Uint8Array(8);
          nx[0] = xv & 255; nx[1] = (xv >> 8) & 255; nx[2] = (xv >> 16) & 255; nx[3] = (xv >> 24) & 255;
          nx[4] = yv & 255; nx[5] = (yv >> 8) & 255; nx[6] = (yv >> 16) & 255; nx[7] = (yv >> 24) & 255;
          s.t = concat([s.t.slice(0, g), nx, s.t.slice(g + 8)]);
          return true;
        }

}
async function exportBtw() {
  try {
    const spec = JSON.parse(document.getElementById('spec').value);
    const base = Uint8Array.from(atob(BASE_BTW), c => c.charCodeAt(0));
    const zs = await firstZlibStream(base);
    const blob = await zlibDecompress(base.subarray(zs));
    const segs = segParse(blob);
    const objs = findObjects(segs);
    const tb = objs.filter(b => /^文本 \d+$/.test(b.name));
    const bc = objs.filter(b => /^条形码 \d+$/.test(b.name));
    if (!tb.length) throw new Error('母版无文本块');
    const texts = (spec.objects || []).filter(o => o.type === 'text');
    const bcs = (spec.objects || []).filter(o => o.type === 'barcode');
    if (texts.length > tb.length) throw new Error(`文本 ${texts.length} 超母版容量 ${tb.length}`);
    if (bcs.length > bc.length) throw new Error(`条码超出母版容量`);
    const vals = resolve(spec);
    vals.sn_total = vals.sn_total ?? (spec.variables?.sn?.total ?? '');
    const sub = t => (t ?? '').replace(/\{(\w+)\}/g, (m, kk) => (kk in vals ? vals[kk] : m));
    const patch = (o, name, content, ob) => {
      const seen = new Set();
      for (let k = o.s0; k <= o.e; k++) {
        const s = segs[k];
        if (s.k === 's' && NAME_RE.test(s.t) && !seen.has(k)) { seen.add(k); setSeg(segs, k, name); }
      }
      for (const k of o.contents) {
        const s = segs[k];
        if (s.k === 's' && !NAME_RE.test(s.t)) setSeg(segs, k, sub(content) || '');
      }
      if (ob && ob.x != null) {
        if (!setGeo(segs, o, ob.x, ob.y)) throw new Error('坐标定位失败: ' + (content || name));
      }
    };
    texts.forEach((ob, i) => patch(tb[i], `文本 ${i + 1}`, ob.text || '', ob));
    for (let i = texts.length; i < tb.length; i++) patch(tb[i], `文本 ${i + 1}`, '', null);
    if (bcs.length) patch(bc[0], '条形码 1', bcs[0].data || '', bcs[0]);
    for (let i = bcs.length; i < bc.length; i++) patch(bc[i], '条形码 1', '', null);
    const blob2 = rebuildSegs(segs);
    const z2 = await zlibCompress(blob2);
    const out = new Blob([base.subarray(0, zs), z2], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(out);
    a.download = (spec.name || 'label') + '.btw';
    a.click();
    busy('btw 已下载 ✓ 打印前请上 Windows BarTender 验一眼');
    return concat([base.subarray(0, zs), z2]);
  } catch (e) {
    busy('btw 生成失败: ' + e.message);
    console.error(e);
  }
}

let editMode = false, handles = [];
function toggleEdit() {
  editMode = !editMode;
  document.getElementById('editBtn').textContent = editMode ? '✅ 编辑中' : '✋ 编辑';
  rebuildHandles();
}
function rebuildHandles() {
  const ov = document.getElementById('overlay');
  ov.innerHTML = '';
  handles = [];
  if (!editMode) return;
  const c = document.getElementById('png');
  const spec = JSON.parse(document.getElementById('spec').value || '{}');
  const stW = spec.size.w, stH = spec.size.h;
  (spec.objects || []).forEach((ob, idx) => {
    if (!['text','barcode','box','image'].includes(ob.type)) return;
    if (ob.x == null) return;
    const h = document.createElement('div');
    h.className = 'handle';
    h.dataset.idx = idx;
    const wmm = ob.type === 'box' ? ob.w : (ob.w || estW(ob, spec));
    const hmm = ob.type === 'box' ? ob.h : (ob.type === 'barcode' ? ob.h + (ob.showtext !== false ? 4 : 0) : (ob.size || 4));
    h.style.left = (ob.x / stW * 100) + '%';
    h.style.top = (ob.y / stH * 100) + '%';
    h.style.width = (wmm / stW * 100) + '%';
    h.style.height = (hmm / stH * 100) + '%';
    h.dataset.x0 = ob.x; h.dataset.y0 = ob.y;
    ov.appendChild(h);
    dragify(h, idx, ob, spec, wmm, hmm);
    handles.push(h);
  });
}
function estW(ob) {
  // 估宽: 字符数×(CJK=size, ascii≈size*0.55)
  const t = ob.type === 'barcode' ? (ob.data || '') : (ob.text || '');
  let w = 0;
  for (const ch of t.replace(/\{\w+\}/g, 'X')) w += (ch.charCodeAt(0) > 0x2E80 ? 1 : 0.55) * (ob.size || 4);
  return Math.max(6, w);
}
function dragify(h, idx, ob, spec, wmm, hmm) {
  h.onpointerdown = ev => {
    ev.preventDefault();
    h.setPointerCapture(ev.pointerId);
    const c = document.getElementById('png');
    const rect = c.getBoundingClientRect();
    const scale = { x: rect.width / spec.size.w, y: rect.height / spec.size.h };
    let ox = ev.clientX - rect.left - mm(ob.x), oy = ev.clientY - rect.top - mm(ob.y);
    h.onpointermove = e => {
      let nx = (e.clientX - rect.left - ox) / scale.x;
      let ny = (e.clientY - rect.top - oy) / scale.y;
      nx = Math.max(0, Math.min(spec.size.w - wmm, nx));
      ny = Math.max(0, Math.min(spec.size.h - hmm, ny));
      ob.x = Math.round(nx * 10) / 10;
      ob.y = Math.round(ny * 10) / 10;
      h.style.left = (ob.x / spec.size.w * 100) + '%';
      h.style.top = (ob.y / spec.size.h * 100) + '%';
      document.getElementById('spec').value = JSON.stringify(spec, null, 2);
      renderSpecTo(spec);
    };
    h.onpointerup = () => { h.onpointermove = null; };
  };
}
